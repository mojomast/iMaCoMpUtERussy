<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoStorage-8 Debug Test</title>
    <style>
        body { background: black; color: #00ff00; font-family: monospace; padding: 20px; }
        .test-section { border: 1px solid #00ff00; margin: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h1>VideoStorage-8 Debug Test</h1>
    
    <div class="test-section">
        <h2>Module Loading Test</h2>
        <div id="module-status">Testing...</div>
    </div>

    <div class="test-section" id="debugger">
        <h2>Debugger</h2>
        <div id="registers"></div>
    </div>

    <div class="test-section" id="memory-viewer">
        <h2>Memory Viewer</h2>
        <div id="memory-display"></div>
    </div>

    <div class="test-section" id="video-manager">
        <h2>Video Manager</h2>
        <div id="video-controls"></div>
    </div>

    <script type="module">
        console.log('Starting debug test...');
        
        async function testModules() {
            const statusDiv = document.getElementById('module-status');
            statusDiv.innerHTML = 'Loading modules...<br>';
            
            try {
                // Test CPU module
                console.log('Testing CPU module...');
                const cpuModule = await import('./js/cpu.js');
                statusDiv.innerHTML += '✓ CPU module loaded<br>';
                
                // Test Memory module
                console.log('Testing Memory module...');
                const memoryModule = await import('./js/memory.js');
                statusDiv.innerHTML += '✓ Memory module loaded<br>';
                
                // Test Assembler module
                console.log('Testing Assembler module...');
                const assemblerModule = await import('./js/assembler.js');
                statusDiv.innerHTML += '✓ Assembler module loaded<br>';
                
                // Test UI modules
                console.log('Testing Debugger UI module...');
                const debuggerModule = await import('./js/ui/debugger.js');
                statusDiv.innerHTML += '✓ Debugger UI module loaded<br>';
                
                console.log('Testing Memory Viewer UI module...');
                const memoryViewerModule = await import('./js/ui/memory-viewer.js');
                statusDiv.innerHTML += '✓ Memory Viewer UI module loaded<br>';
                
                console.log('Testing Video Manager UI module...');
                const videoManagerModule = await import('./js/ui/video-manager.js');
                statusDiv.innerHTML += '✓ Video Manager UI module loaded<br>';
                
                // Test initialization
                console.log('Testing UI initialization...');
                statusDiv.innerHTML += 'Initializing UI components...<br>';
                
                if (debuggerModule.initializeDebugger) {
                    debuggerModule.initializeDebugger('debugger');
                    statusDiv.innerHTML += '✓ Debugger initialized<br>';
                } else {
                    statusDiv.innerHTML += '✗ Debugger initializeDebugger function not found<br>';
                }
                
                if (memoryViewerModule.initializeMemoryViewer) {
                    memoryViewerModule.initializeMemoryViewer('memory-viewer');
                    statusDiv.innerHTML += '✓ Memory Viewer initialized<br>';
                } else {
                    statusDiv.innerHTML += '✗ Memory Viewer initializeMemoryViewer function not found<br>';
                }
                
                if (videoManagerModule.initializeVideoManager) {
                    videoManagerModule.initializeVideoManager('video-manager');
                    statusDiv.innerHTML += '✓ Video Manager initialized<br>';
                } else {
                    statusDiv.innerHTML += '✗ Video Manager initializeVideoManager function not found<br>';
                }
                
                statusDiv.innerHTML += '<br>✓ All tests completed!';
                
            } catch (error) {
                console.error('Test failed:', error);
                statusDiv.innerHTML += `✗ Error: ${error.message}<br>`;
                statusDiv.innerHTML += `Stack: ${error.stack}<br>`;
            }
        }
        
        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', testModules);
        } else {
            testModules();
        }
    </script>
</body>
</html>
